<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Errores de PC</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-gray-800 text-center">Reportar Error de PC</h2>

        <form id="report-form" class="space-y-4" onsubmit="enviarReporte(event)">
            <div class="flex flex-col gap-2 p-3 bg-blue-50 rounded-lg">
                <p class="text-sm text-gray-600">Los reportes se guardan en Google Sheets.</p>
                <a href="<?= ScriptApp.getService().getUrl() ?>?page=dashboard" class="w-full text-center bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold py-1.5 px-3 rounded transition uppercase tracking-wider block mt-1">
                    📊 Ir al Dashboard Técnico
                </a>
            </div>

            <div>
                <label for="user-email" class="block text-sm font-medium text-gray-700">Correo electrónico</label>
                <input type="email" id="user-email" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm" placeholder="tu-email@correo.com" required maxlength="254">
            </div>

            <div>
                <label for="select-pc" class="block text-sm font-medium text-gray-700">Seleccionar Computadora</label>
                <select id="select-pc" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm bg-white" required>
                    <option value="">-- Seleccione una PC --</option>
                </select>
            </div>

            <div>
                <label for="select-error" class="block text-sm font-medium text-gray-700">Tipo de Error</label>
                <select id="select-error" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm bg-white" required>
                    <option value="">-- Seleccione el Error --</option>
                    <option value="ERROR DE SISTEMA OPERATIVO">ERROR DE SISTEMA OPERATIVO</option>
                    <option value="CPU">CPU</option>
                    <option value="MONITOR">MONITOR</option>
                    <option value="TECLADO">TECLADO</option>
                    <option value="MOUSE">MOUSE</option>
                    <option value="OTROS">OTRO (Especificar abajo)</option>
                </select>
            </div>

            <div>
                <label for="text-descripcion" class="block text-sm font-medium text-gray-700">Descripción breve</label>
                <textarea id="text-descripcion" rows="3" maxlength="80" class="mt-1 block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-green-500 focus:border-green-500" placeholder="Describe brevemente qué sucede..."></textarea>
                <p class="text-right text-xs text-gray-400 mt-1"><span id="contador-caracteres">0</span>/80 caracteres</p>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white p-2 rounded-md hover:bg-green-700 transition">Registrar Reporte</button>
        </form>
    </div>

<script>
    window.onload = function() {
        const selectPc = document.getElementById('select-pc');
        const letras = ['A', 'B', 'C', 'D', 'E'];
        letras.forEach(letra => {
            for (let i = 1; i <= 5; i++) {
                const opcion = `${letra}${i}`;
                const el = document.createElement('option');
                el.value = opcion;
                el.textContent = opcion;
                selectPc.appendChild(el);
            }
        });
    };

    function actualizarContador() {
        const textarea = document.getElementById('text-descripcion');
        document.getElementById('contador-caracteres').textContent = textarea.value.length;
    }

    document.getElementById('text-descripcion').addEventListener('input', actualizarContador);

    function enviarReporte(event) {
        event.preventDefault();
        const formulario = document.getElementById('report-form');
        if (!formulario.reportValidity()) return;

        const boton = formulario.querySelector('button[type="submit"]');
        boton.disabled = true;
        boton.textContent = 'Guardando...';

        const reporte = {
            usuario_email: document.getElementById('user-email').value.trim(),
            computadora: document.getElementById('select-pc').value,
            tipo_error: document.getElementById('select-error').value,
            descripcion: document.getElementById('text-descripcion').value.trim()
        };

        google.script.run
            .withSuccessHandler(function() {
                alert(`¡Reporte registrado! PC: ${reporte.computadora}`);
                formulario.reset();
                actualizarContador();
                boton.disabled = false;
                boton.textContent = 'Registrar Reporte';
            })
            .withFailureHandler(function(error) {
                alert('Error al guardar el reporte: ' + error.message);
                boton.disabled = false;
                boton.textContent = 'Registrar Reporte';
            })
            .guardarReporte(reporte);
    }
</script>

</body>
</html>
